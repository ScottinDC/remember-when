[build]
  command = "npm run build:netlify"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # This is a Vite SPA, not Next.js — skip auto-installed Next.js runtime plugin.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON,OPENAI_API_KEY,SENDGRID_API_KEY,DIGEST_SECRET"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["better-sqlite3", "@google-cloud/storage"]
  included_files = ["server/**"]

[functions."api"]
  timeout = 26

[functions."weekly-digest"]
  schedule = "0 18 * * 6"
  timeout = 26

[dev]
  command = "npm run client"
  targetPort = 5173
  port = 8888
  autoLaunch = false

[[redirects]]
  from = "/oauth-capture.js"
  to = "/oauth-capture.js"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
