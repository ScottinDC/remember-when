name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/send-weekly-digest/deno.json supabase/functions/send-weekly-digest/index.ts
      - run: deno check --no-lock --config supabase/functions/process-answer/deno.json supabase/functions/claim-access/index.ts supabase/functions/process-answer/index.ts supabase/functions/delete-answer/index.ts supabase/functions/archive-audio/index.ts
  browser:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            browsers: chromium
            projects: --project=local --project=mobile
          # Match the platform used for real WebKit MediaRecorder validation.
          - runner: macos-latest
            browsers: webkit
            projects: --project=webkit
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browsers }}
      - run: npm run test:e2e -- ${{ matrix.projects }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-${{ matrix.runner }}
          path: e2e-results/
          retention-days: 7
