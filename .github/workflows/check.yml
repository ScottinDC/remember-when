name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/send-weekly-digest/deno.json supabase/functions/send-weekly-digest/index.ts
      - run: deno check --no-lock --config supabase/functions/process-answer/deno.json supabase/functions/claim-access/index.ts supabase/functions/process-answer/index.ts supabase/functions/delete-answer/index.ts supabase/functions/archive-audio/index.ts
